[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "waypoint-ttnn"
version = "0.1.2"
description = "Waypoint-1.5-1B interactive world model on Tenstorrent Blackhole via TTNN. `uv build` here packages the whole waypoint_ttnn tree, bring-up scripts and tests included. That is fine for local development. The published episod/tt-waypoint bundle does not use this wheel: packaging/package-thin.sh ships the served-path files as source (--extra-code), and packaging/closure.py computes which files those are."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["waypoint_ttnn*"]
